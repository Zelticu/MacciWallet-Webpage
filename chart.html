<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MACCI Live Price Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: 'Comfortaa', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h1 style="color:crimson;">📈 MACCI Live Price Chart</h1>
  <canvas id="priceChart" width="800" height="400"></canvas>

  <script>
    async function loadPriceData() {
      const res = await fetch("https://your-render-app-url.onrender.com/price_data");
      const data = await res.json();

      const labels = data.map(p => new Date(p.timestamp).toLocaleTimeString());
      const prices = data.map(p => p.price);

      const ctx = document.getElementById('priceChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'MACCI Price (USD)',
            data: prices,
            borderColor: 'crimson',
            backgroundColor: 'rgba(220, 20, 60, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: 'Time' } },
            y: { title: { display: true, text: 'Price (USD)' } }
          }
        }
      });
    }

    loadPriceData();
  </script>
</body>
</html>
